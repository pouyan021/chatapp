spring:
  cassandra:
    keyspace-name: chatapp_dev
server:
  address: 127.0.0.1
chat:
  security:
    issuer: http://localhost:${server.port:8080}/dev
    jwk-set-uri: http://localhost:${server.port:8080}/dev/jwks
    allowed-origins: http://localhost:${server.port:8080},http://127.0.0.1:${server.port:8080}
  broker:
    login: chatapp
    passcode: chatapp123
  storage:
    access-key: chatapp
    secret-key: chatapp123
springdoc:
  api-docs:
    enabled: true
  swagger-ui:
    enabled: true
    persist-authorization: false
  paths-to-match: /api/**
  override-with-generic-response: false

logging:
  structured:
    format:
      console: ""
management:
  tracing:
    sampling:
      probability: 1.0
