spring:
  docker:
    compose:
      profiles:
        active: observability
management:
  server:
    address: 127.0.0.1
    port: 8081
  endpoints:
    web:
      exposure:
        include: health,prometheus
  otlp:
    metrics:
      export:
        enabled: true
        url: ${CHAT_OTLP_ENDPOINT:http://localhost:4318}/v1/metrics
        step: 5s
        base-time-unit: seconds
  tracing:
    export:
      otlp:
        enabled: true
  logging:
    export:
      otlp:
        enabled: true
  opentelemetry:
    tracing:
      export:
        otlp:
          endpoint: ${CHAT_OTLP_ENDPOINT:http://localhost:4318}/v1/traces
    logging:
      export:
        otlp:
          endpoint: ${CHAT_OTLP_ENDPOINT:http://localhost:4318}/v1/logs
